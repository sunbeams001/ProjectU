name: Build Release

# 触发条件：推送版本标签（如 v1.0.0）
on:
  push:
    tags:
      - 'v*'

# 权限配置：允许创建 Release
permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      # 从 GitHub Secrets 解码 keystore
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "✓ Keystore decoded successfully"
          else
            echo "⚠ Warning: RELEASE_KEYSTORE_BASE64 secret not found"
            echo "Release build will use debug signing"
          fi
      
      # 构建 Release APK
      - name: Build release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
      
      # 清理临时 keystore 文件
      - name: Cleanup keystore
        if: always()
        run: |
          if [ -f release.keystore ]; then
            rm -f release.keystore
            echo "✓ Temporary keystore cleaned up"
          fi
      
      # 获取版本信息
      - name: Get version name
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      # 重命名 APK
      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv composeApp/build/outputs/apk/release/composeApp-release.apk \
             composeApp/build/outputs/apk/release/ProjectU-${VERSION}.apk
          echo "✓ APK renamed to ProjectU-${VERSION}.apk"
      
      # 上传到 Artifacts
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.version }}
          path: composeApp/build/outputs/apk/release/ProjectU-${{ steps.version.outputs.version }}.apk
          retention-days: 90
      
      - name: Build info
        run: |
          echo "✓ Android Release APK built successfully"
          echo "📦 Artifact: ProjectU-${{ steps.version.outputs.version }}.apk"
          echo "🔐 Signing: Release keystore"
          ls -lh composeApp/build/outputs/apk/release/

  build-desktop:
    name: Build Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux
            package-task: packageDeb
            package-ext: deb
          - os: windows-latest
            artifact-name: windows
            package-task: packageMsi
            package-ext: msi
          - os: macos-latest
            artifact-name: macos
            package-task: packageDmg
            package-ext: dmg
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew (Unix)
        if: matrix.os != 'windows-latest'
        run: chmod +x gradlew
      
      # 获取版本信息
      - name: Get version name
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      # 构建平台特定安装包（MSI/DMG/DEB）
      - name: Build platform-specific package (Unix)
        run: ./gradlew :composeApp:${{ matrix.package-task }} --stacktrace
        if: matrix.os != 'windows-latest'
      
      - name: Build platform-specific package (Windows)
        run: .\gradlew.bat :composeApp:${{ matrix.package-task }} --stacktrace
        if: matrix.os == 'windows-latest'
      
      # 停止 Gradle daemon 以避免文件锁定问题
      - name: Stop Gradle daemon (Unix)
        if: matrix.os != 'windows-latest' && always()
        run: ./gradlew --stop
      
      - name: Stop Gradle daemon (Windows)
        if: matrix.os == 'windows-latest' && always()
        run: .\gradlew.bat --stop
      
      # 查找并重命名安装包
      - name: Rename package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PACKAGE=$(find composeApp/build/compose/binaries/main/${{ matrix.package-ext }}/ -name "*.deb" | head -n 1)
          if [ -f "$PACKAGE" ]; then
            mv "$PACKAGE" "ProjectU-${VERSION}-linux.deb"
            echo "✓ Package renamed to ProjectU-${VERSION}-linux.deb"
            ls -lh ProjectU-*.deb
          else
            echo "❌ DEB package not found"
            exit 1
          fi
      
      - name: Rename package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $PACKAGE = Get-ChildItem "composeApp\build\compose\binaries\main\${{ matrix.package-ext }}\*.msi" | Select-Object -First 1
          if ($PACKAGE) {
            Move-Item $PACKAGE.FullName "ProjectU-${VERSION}-windows.msi"
            Write-Output "✓ Package renamed to ProjectU-${VERSION}-windows.msi"
            Get-Item ProjectU-*.msi | Format-List Name, Length
          } else {
            Write-Error "❌ MSI package not found"
            exit 1
          }
      
      - name: Rename package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PACKAGE=$(find composeApp/build/compose/binaries/main/${{ matrix.package-ext }}/ -name "*.dmg" | head -n 1)
          if [ -f "$PACKAGE" ]; then
            mv "$PACKAGE" "ProjectU-${VERSION}-macos.dmg"
            echo "✓ Package renamed to ProjectU-${VERSION}-macos.dmg"
            ls -lh ProjectU-*.dmg
          else
            echo "❌ DMG package not found"
            exit 1
          fi
      
      # 上传安装包
      - name: Upload Desktop package (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.artifact-name }}-${{ steps.version.outputs.version }}
          path: ProjectU-${{ steps.version.outputs.version }}-linux.deb
          retention-days: 90
      
      - name: Upload Desktop package (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.artifact-name }}-${{ steps.version.outputs.version }}
          path: ProjectU-${{ steps.version.outputs.version }}-windows.msi
          retention-days: 90
      
      - name: Upload Desktop package (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.artifact-name }}-${{ steps.version.outputs.version }}
          path: ProjectU-${{ steps.version.outputs.version }}-macos.dmg
          retention-days: 90
      
      - name: Build info (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          echo "✓ Desktop Release build successful for ${{ matrix.os }}"
          echo "📦 Package: ProjectU-${{ steps.version.outputs.version }}-${{ matrix.artifact-name }}.${{ matrix.package-ext }}"
          ls -lh ProjectU-*.${{ matrix.package-ext }}
      
      - name: Build info (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Output "✓ Desktop Release build successful for ${{ matrix.os }}"
          Write-Output "📦 Package: ProjectU-${{ steps.version.outputs.version }}-${{ matrix.artifact-name }}.${{ matrix.package-ext }}"
          Get-ChildItem ProjectU-*.${{ matrix.package-ext }}

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 获取版本信息
      - name: Get version name
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      # 下载所有构建产物
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      # 列出所有文件
      - name: List artifacts
        run: |
          echo "📦 All artifacts:"
          ls -lhR artifacts/
      
      # 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/android-release-${{ steps.version.outputs.version }}/*.apk
            artifacts/desktop-release-*/*.deb
            artifacts/desktop-release-*/*.msi
            artifacts/desktop-release-*/*.dmg
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 ProjectU ${{ steps.version.outputs.version }}
            
            ### 平台支持
            - 🤖 **Android**: APK (支持 Android 7.0+)
            - 🐧 **Linux**: DEB 安装包
            - 🪟 **Windows**: MSI 安装包
            - 🍎 **macOS**: DMG 镜像
            
            ### 新增
            1. ABC
            2. DEF

            ### 更新
            1. ABC
            2. DEF

            ### 修复
            1. ABC
            2. DEF
            
            ### 安装说明
            
            **Android:**
            1. 下载 `ProjectU-${{ steps.version.outputs.version }}.apk`
            2. 安装 APK（可能需要允许未知来源）
            
            **Desktop:**
            - **Windows**: 下载 MSI 文件，双击安装
            - **macOS**: 下载 DMG 文件，拖动到应用程序文件夹
            - **Linux**: 下载 DEB 文件，使用 `sudo dpkg -i ProjectU-*.deb` 安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release info
        run: |
          echo "✓ GitHub Release created successfully"
          echo "🚀 Release: ${{ steps.version.outputs.version }}"
          echo "📦 Includes:"
          echo "  - Android APK"
          echo "  - Windows MSI"
          echo "  - macOS DMG"
          echo "  - Linux DEB"
