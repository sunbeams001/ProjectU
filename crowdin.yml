project_id: '859244'
api_token_env: CROWDIN_TOKEN
preserve_hierarchy: 1
files:
  # Compose Multiplatform 模块 (主要UI字符串)
  - source: /composeApp/src/commonMain/composeResources/values/strings.xml
    translation: /composeApp/src/commonMain/composeResources/values-%android_code%/strings.xml
    languages_mapping:
      android_code:
        zh-CN: zh-rCN    # Simplified Chinese
        zh-TW: zh-rTW    # Traditional Chinese
        ja: ja           # Japanese
        ko: ko           # Korean
        ru: ru           # Russian
        ms: ms           # Malay
        th: th           # Thai
        es: es           # Spanish
        hi: hi           # Hindi
    update_option: update_as_unapproved
  
  # Android Native 模块 (Widget、分享等Android专属功能)
  - source: /androidApp/src/main/res/values/strings.xml
    translation: /androidApp/src/main/res/values-%android_code%/strings.xml
    languages_mapping:
      android_code:
        zh-CN: zh-rCN    # Simplified Chinese
        zh-TW: zh-rTW    # Traditional Chinese
        ja: ja           # Japanese
        ko: ko           # Korean
        ru: ru           # Russian
        ms: ms           # Malay
        th: th           # Thai
        es: es           # Spanish
        hi: hi           # Hindi
    update_option: update_as_unapproved
pull_request_title: New Crowdin translations by Github Action
pull_request_labels:
  - translations
  - autogenerated
commit_message: New translations from Crowdin
