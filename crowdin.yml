# Crowdin Configuration for ProjectU
# 
# This file configures the Crowdin CLI for automatic synchronization
# of translation files between your project and Crowdin platform.
#
# Documentation: https://crowdin.github.io/crowdin-cli/configuration

# Project identifier on Crowdin
# You can find this in: Project Settings > API > Project ID
project_id: "859244"

# API token for authentication
# Store your token in environment variable CROWDIN_TOKEN for security
# Get your token from: Account Settings > API > Personal Access Tokens
api_token_env: CROWDIN_TOKEN

# Preserve existing translations hierarchy
preserve_hierarchy: true

# Files configuration
files:
  # Source file (English - default language)
  - source: /composeApp/src/commonMain/composeResources/values/strings.xml
    
    # Translation file path pattern
    # %android_code% will be replaced with appropriate language codes
    translation: /composeApp/src/commonMain/composeResources/values-%android_code%/strings.xml
    
    # Android language code mapping
    # Maps Crowdin language codes to Android resource qualifiers
    languages_mapping:
      android_code:
        zh-CN: zh-rCN    # Simplified Chinese
        zh-TW: zh-rTW    # Traditional Chinese
        ja: ja           # Japanese
        ko: ko           # Korean
    
    # Update options
    # update_as_unapproved: Add new translations as unapproved (safe)
    # update_without_changes: Skip files without changes
    update_option: update_as_unapproved
    
    # Skip untranslated strings when downloading
    # Set to false to include keys with empty translations
    skip_untranslated_strings: false
    
    # Skip untranslated files when downloading
    # Set to false to download files even if not fully translated
    skip_untranslated_files: false
    
    # Export only approved translations
    # Set to true to ensure translation quality
    export_only_approved: false

pull_request_title: "New Crowdin translations by Github Action"
pull_request_labels:
  - translations
  - autogenerated
commit_message: "New translations from Crowdin"
